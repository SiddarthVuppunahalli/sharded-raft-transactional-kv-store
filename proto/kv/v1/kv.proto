// Typed gRPC APIs for the sharded Raft key-value store.
//
// Three surfaces are defined here:
//   * KV             - client-facing single-key operations and transactions
//   * RaftTransport  - node-to-node delivery of Raft messages for every range
//   * TxnParticipant - 2PC messages between the coordinator and range leaders
//   * Admin          - cluster introspection used by tooling and evaluation
//
// Regenerate Go code with: scripts/genproto.sh
syntax = "proto3";

package kv.v1;

option go_package = "github.com/SiddarthVuppunahalli/sharded-raft-transactional-kv-store/api/kvpb;kvpb";

// ---------------------------------------------------------------------------
// Common types
// ---------------------------------------------------------------------------

// Hybrid/monotonic timestamp allocated by the metadata service.
message Timestamp {
  uint64 wall_time = 1;
  uint32 logical = 2;
}

message RangeDescriptor {
  uint64 range_id = 1;
  bytes start_key = 2;         // inclusive
  bytes end_key = 3;           // exclusive, empty = end of keyspace
  repeated uint64 replica_node_ids = 4;
  uint64 generation = 5;       // bumped on split / replica change
}

// Returned in place of a result when the receiving node cannot serve the
// request. Clients use leader_hint / range to retry against the right node.
message RoutingError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    NOT_LEADER = 1;
    RANGE_NOT_FOUND = 2;
    KEY_OUT_OF_RANGE = 3;      // stale range map, refresh and retry
    NO_QUORUM = 4;
  }
  Code code = 1;
  uint64 leader_hint_node_id = 2;
  string leader_hint_addr = 3;
  RangeDescriptor range = 4;
}

// ---------------------------------------------------------------------------
// Client KV API
// ---------------------------------------------------------------------------

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Multi-key atomic transaction. Served by the 2PC coordinator when the
  // transaction layer is registered on the node; returns UNIMPLEMENTED
  // otherwise.
  rpc Txn(TxnRequest) returns (TxnResponse);
}

message GetRequest {
  bytes key = 1;
  // Optional MVCC snapshot. Zero means "latest committed" (linearizable).
  Timestamp read_timestamp = 2;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  uint64 range_id = 3;
  uint64 raft_index = 4;
  RoutingError routing_error = 5;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  uint64 range_id = 1;
  uint64 raft_index = 2;
  RoutingError routing_error = 3;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  uint64 range_id = 1;
  uint64 raft_index = 2;
  RoutingError routing_error = 3;
}

message TxnOp {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    GET = 1;
    PUT = 2;
    DELETE = 3;
  }
  Type type = 1;
  bytes key = 2;
  bytes value = 3;
}

message TxnOpResult {
  bytes key = 1;
  bool found = 2;
  bytes value = 3;
}

// A one-shot transaction: reads are served at the transaction's snapshot and
// writes are committed atomically across all ranges they touch.
message TxnRequest {
  repeated TxnOp ops = 1;
  // Optional compare guards (all must hold for the writes to apply).
  repeated TxnCompare compares = 2;
}

message TxnCompare {
  bytes key = 1;
  bool expect_found = 2;
  bytes expected_value = 3;
}

enum TxnStatus {
  TXN_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  PREPARED = 2;
  COMMITTED = 3;
  ABORTED = 4;
}

message TxnResponse {
  bytes txn_id = 1;
  TxnStatus status = 2;
  Timestamp commit_timestamp = 3;
  repeated TxnOpResult results = 4;
  string abort_reason = 5;
}

// ---------------------------------------------------------------------------
// Inter-node Raft transport
// ---------------------------------------------------------------------------

service RaftTransport {
  // Batched delivery of Raft messages. Each message carries the range it
  // belongs to so one connection multiplexes every Raft group on a node.
  rpc Send(RaftMessageBatch) returns (RaftMessageAck);
}

message RaftMessage {
  uint64 range_id = 1;
  uint64 from_node_id = 2;
  uint64 to_node_id = 3;
  // Serialized go.etcd.io/raft/v3/raftpb.Message.
  bytes message = 4;
}

message RaftMessageBatch {
  repeated RaftMessage messages = 1;
}

message RaftMessageAck {
  uint32 accepted = 1;
}

// ---------------------------------------------------------------------------
// Two-phase commit between coordinator and range leaders
// ---------------------------------------------------------------------------

service TxnParticipant {
  // Phase 1: replicate intents through the range's Raft log and lock keys.
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
  // Phase 2: make intents visible at commit_timestamp.
  rpc Commit(CommitRequest) returns (CommitResponse);
  // Phase 2 (negative): discard intents and release locks.
  rpc Abort(AbortRequest) returns (AbortResponse);
  // Recovery: a participant holding a prepared intent asks for the outcome.
  rpc QueryStatus(QueryStatusRequest) returns (QueryStatusResponse);
}

message PrepareRequest {
  bytes txn_id = 1;
  uint64 range_id = 2;
  Timestamp start_timestamp = 3;
  repeated TxnOp writes = 4;
  repeated TxnCompare compares = 5;
  string coordinator_addr = 6;
}

message PrepareResponse {
  enum Vote {
    VOTE_UNSPECIFIED = 0;
    YES = 1;
    NO = 2;
  }
  Vote vote = 1;
  string reason = 2;
  RoutingError routing_error = 3;
}

message CommitRequest {
  bytes txn_id = 1;
  uint64 range_id = 2;
  Timestamp commit_timestamp = 3;
}

message CommitResponse {
  RoutingError routing_error = 1;
}

message AbortRequest {
  bytes txn_id = 1;
  uint64 range_id = 2;
}

message AbortResponse {
  RoutingError routing_error = 1;
}

message QueryStatusRequest {
  bytes txn_id = 1;
}

message QueryStatusResponse {
  TxnStatus status = 1;
  Timestamp commit_timestamp = 2;
}

// ---------------------------------------------------------------------------
// Admin / introspection
// ---------------------------------------------------------------------------

service Admin {
  rpc Status(StatusRequest) returns (StatusResponse);
}

message StatusRequest {}

message RangeStatus {
  RangeDescriptor range = 1;
  uint64 leader_node_id = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  uint64 applied_index = 5;
  string raft_state = 6; // StateLeader / StateFollower / ...
}

message StatusResponse {
  uint64 node_id = 1;
  string addr = 2;
  repeated RangeStatus ranges = 3;
  map<uint64, string> peers = 4;
}
